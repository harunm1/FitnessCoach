# Runs on every push and pull request. A PR cannot be merged until this passes
# once we make it a required check in branch protection (same setup as my AI-M repo).
# The steps mirror the npm scripts, and the build runs the same script Vercel uses,
# so what passes locally passes here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitnesscoach
          POSTGRES_PASSWORD: fitnesscoach
          POSTGRES_DB: fitnesscoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitnesscoach -d fitnesscoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fitnesscoach:fitnesscoach@localhost:5432/fitnesscoach_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # The Vercel build script as a preview build runs it: the URL checks, prisma
      # migrate deploy, the exercise seed, then next build. It runs against its own
      # empty database, so it checks migrate-from-empty plus seed as on a new Neon
      # branch, and the seeded library never reaches the test database the browser
      # tests use (their starter plans pick from the exercises they insert).
      - run: psql "postgresql://fitnesscoach:fitnesscoach@localhost:5432/fitnesscoach_test" -c "CREATE DATABASE fitnesscoach_build"
      - run: npx --no-install tsx scripts/vercel-build.ts
        env:
          VERCEL_ENV: preview
          DATABASE_URL: postgresql://fitnesscoach:fitnesscoach@localhost:5432/fitnesscoach_build?schema=public
          DATABASE_URL_UNPOOLED: postgresql://fitnesscoach:fitnesscoach@localhost:5432/fitnesscoach_build?schema=public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
